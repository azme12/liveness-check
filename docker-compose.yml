services:
  api:
    build: .
    image: liveness-api:0.1.0
    container_name: liveness-api
    ports:
      - "8000:8000"
    environment:
      LIVENESS_API_KEY: ${LIVENESS_API_KEY:-sk_test_liveness_dev}
      LIVENESS_DEBUG: ${LIVENESS_DEBUG:-false}
      LIVENESS_DATABASE_URL: sqlite+aiosqlite:////app/data/liveness.db
      LIVENESS_STORAGE_DIR: /app/storage
      LIVENESS_MODELS_DIR: /app/models
      LIVENESS_FACE_MATCH_THRESHOLD: "0.45"
      LIVENESS_LIVENESS_THRESHOLD: "0.5"
      LIVENESS_ALLOW_HEURISTIC_FALLBACK: "true"
    volumes:
      - liveness-data:/app/data
      - liveness-storage:/app/storage
      - liveness-models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Browser UI to view SQLite tables (Docker-only, no local files)
  db-ui:
    image: coleifer/sqlite-web:latest
    container_name: liveness-db-ui
    ports:
      - "8080:8080"
    command: ["sqlite_web", "-H", "0.0.0.0", "-p", "8080", "/data/liveness.db"]
    volumes:
      - liveness-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  liveness-data:
  liveness-storage:
  liveness-models:
