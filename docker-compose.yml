services:
  mongo:
    image: mongo:7
    container_name: liveness-mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: liveness
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build: ./backend
    image: livencube-backend:0.1.0
    container_name: livencube-backend
    ports:
      - "8100:8100"
    environment:
      LIVENCUBE_MONGODB_URL: mongodb://mongo:27017
      LIVENCUBE_MONGODB_DB: liveness
      LIVENCUBE_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LIVENCUBE_JWT_SECRET: ${LIVENCUBE_JWT_SECRET:-livencube-dev-secret-change-me}
      LIVENESS_API_KEY: ${LIVENESS_API_KEY:-sk_test_liveness_dev}
      LIVENESS_MONGODB_URL: mongodb://mongo:27017
      LIVENESS_MONGODB_DB: liveness
      LIVENESS_STORAGE_DIR: /app/storage
      LIVENESS_MODELS_DIR: /app/models
      LIVENESS_ALLOW_HEURISTIC_FALLBACK: "true"
    volumes:
      - liveness-storage:/app/storage
      - liveness-models:/app/models
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
    image: livencube-frontend:0.1.0
    container_name: livencube-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: liveness-mongo-ui
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  liveness-storage:
  liveness-models:
