services:
  - type: web
    name: liveness-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LIVENCUBE_MONGODB_URL
        sync: false
      - key: LIVENCUBE_MONGODB_DB
        value: liveness
      - key: LIVENCUBE_JWT_SECRET
        generateValue: true
      - key: LIVENCUBE_CORS_ORIGINS
        sync: false
      - key: LIVENESS_MONGODB_URL
        sync: false
      - key: LIVENESS_MONGODB_DB
        value: liveness
      - key: LIVENESS_ALLOW_HEURISTIC_FALLBACK
        value: "true"
